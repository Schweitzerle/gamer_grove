name: gamer_grove
description: Discover, rate and recommend videogames.
publish_to: "none"
version: 2.0.2+31

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  equatable: ^2.0.5
  dartz: ^0.10.1
  fpdart: ^1.1.0
  get_it: ^7.6.7

  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  rxdart: ^0.27.7

  # Observability
  sentry_flutter: ^9.24.0

  # Backend & API
  supabase_flutter: ^2.5.0
  http: ^1.2.0
  dio: ^5.8.0+1
  envied: ^1.3.8

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI & Design
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  # Used directly by CoverTint; cached_network_image pulls it in anyway.
  flutter_cache_manager: ^3.3.1
  shimmer: ^3.0.0
  flex_color_scheme: ^8.3.1
  flutter_staggered_grid_view: ^0.7.0
  youtube_player_flutter: ^9.1.3
  font_awesome_flutter: ^10.8.0
  loading_indicator: ^3.1.1
  country_picker: ^2.0.25
  toasty_box: ^1.0.4

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.0.1
  url_launcher: ^6.2.4
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  permission_handler: ^12.0.0+1
  gal: ^2.3.1
  path: ^1.9.0

  # Animations (minimal)
  flutter_animate: ^4.5.0
  flutter_dotenv: ^5.1.0
  purchases_flutter: ^10.4.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  envied_generator: ^1.3.8
  mockito: ^5.4.4
  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  dart_code_metrics_presets: ^2.26.1
  very_good_analysis: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/legal/
    #- .env

  # Bundled, not fetched at runtime: a font CDN would be a new recipient in the
  # privacy policy. Licences ship alongside the files (both OFL/Apache-style).
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600

# All layers are generated from tool/icon/render.js — see tool/icon/README.md.
# The adaptive layers are deliberately separate files: pointing foreground at
# the full-bleed icon (as this config did before) lets Android's mask cut into
# the mark, because only the inner 66% of an adaptive layer is guaranteed.
flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 24
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  # The tool otherwise insets foreground and monochrome by a further 16%, on
  # top of the safe zone the vector already applies. render.js fits the mark by
  # its diagonal so circular masks (Pixel) cannot bite the arch legs off; a flat
  # percentage inset does not guarantee that and would only shrink the mark.
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B1614"
  image: assets/splash/splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0B1614"
    image: assets/splash/splash_logo_android12.png
